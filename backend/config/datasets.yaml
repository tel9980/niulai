# ── 不同步的接口 ──────────────────────────────────────────────────────────
# 同花顺 AI 客户端专用（免费 Key 返回 2004）：
#   /api/a-share/capital-flow/{snapshot,historical}   /api/a-share/high-frequency/{historical,intraday}
#   /api/a-share/special-data/chip-shape-{dates,stocks}   /api/a-share-index/baseinfo/new-concepts
#   /api/a-share/special-data/turnover-prediction-snapshot   /api/fund/etf-flow/net-inflow-historical
#   /api/futures/fundamentals/indicators-historical   /api/news/events/search
# 尚未上线：stock-basics、ths-index-membership、index-overview
# 工具和计算接口：/api/meta/tickers/search（检索）、/api/fund/backtest/result（在线回测）
# 只有当日数据、没有历史价值：/api/{futures,options}/prices/intraday、/api/{futures,options}/calendar/session-timeline
# 被其他数据集使用：/api/a-share/special-data/auction-opportunity-dates（special.auction_opportunity 的日期来源）、
#                   /api/fund/quota/summary（fund.qdii_quota 的分类汇总，需要时再加）
# 与其他数据集重复：/api/a-share/special-data/anomaly-analysis-stock（与 special.anomaly_reason 重复）、
#                    /api/a-share/special-data/hot-stock-rank-trend（只有前 30 名的排名，与 special.hot_stock_daily 重复）
# 缺字段：/api/a-share/corporate-actions/adjustment-factors（逐只取公司行动，不返回配股字段；用 a_share.corp_action_dump）
# 全市场导出：/api/dump/market-dumps/daily-k[-10d]/download-url（用户决定行情走 REST；可作为对账和灾备的备选）
