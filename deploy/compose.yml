# niulai 的 Docker 部署（镜像来自 ci.yml 构建的 GHCR，可用 Dockge 直接部署）：
# 使用 CI 构建好的镜像，运行内置 PostgreSQL、niulai 和一键升级助手 upgrader 三个容器（upgrader 由 .env 的 COMPOSE_PROFILES 启用）。
# 对外只暴露 niulai 的一个 HTTP 端口，页面和 API 都在这个端口上。全部配置在同目录的 .env 中。
#
#   cp .env.example .env     # 默认值可以直接使用，按需修改端口等
#   docker compose up -d     # 之后打开网页，按引导配置 API Key
#
# 使用本机构建的镜像时，在 .env 中把 NIULAI_IMAGE 改成那个镜像（构建命令见 Dockerfile 开头）。
# 不用 Docker、直接编译运行的方式见 docs/operations/runbook.md#source_deploy；升级、备份、恢复见同一文档的「部署」一节。
#
# 资源上限按 2026-10-18 的服务器实测设置：4 vCPU、3.6 GiB 内存；docker stats 观察到 postgres 常驻约 1.0 GiB、
# niulai 约 240 MiB。上限是峰值的最高值，不是预留：三个服务加起来可以超过物理核数和内存，真正的用量仍受物理资源限制。
# 换到差别较大的服务器时按实测改下面的 mem_limit、cpus；已有部署怎么更新见 docs/operations/runbook.md#resource_limits。
name: niulai

x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: "5" }

services:
  # 内置数据库：端口不对外暴露，只有 niulai 容器能连接。
  # 数据放在 .env 的 POSTGRES_DATA（默认部署目录下的 data/postgres）：宿主机上的普通目录，删除容器、docker compose down -v、
  # docker volume prune 都不影响。见 docs/operations/runbook.md#data_dir
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: niulai
      POSTGRES_DB: niulai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niulai}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB"]
    volumes: ["${POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql"]
    restart: unless-stopped
    # 数据库是内存大户：常驻约 1.0 GiB。上限 1.5 GiB 留出备份、数据核检、排序等的峰值，又不至于把内存全占掉；
    # 2.0 个 CPU 是 4 vCPU 的一半，另一半留给 niulai 和系统
    mem_limit: 1536m
    cpus: 2.0
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "niulai", "-d", "niulai"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # 页面读取缓存：只保存可重建的结果，删除或重启不会影响 PostgreSQL 数据。
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  niulai:
    image: ${NIULAI_IMAGE:-ghcr.io/tel9980/niulai:latest}
    command: ["niulai", "serve"]
    # .env 中的 DATABASE_URL、NIULAI_* 等变量传给 niulai
    env_file: .env
    environment:
      NIULAI_UPGRADE_DIR: /upgrade
      # 为空时关闭共享缓存，服务回退到 PostgreSQL；Redis 服务仍可按需运行。
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
    # 与 upgrader 共享：niulai 在这里写「要升级到的版本号」，upgrader 写进度
    volumes: [upgrade:/upgrade]
    depends_on:
      postgres: { condition: service_healthy }
    # 对外只有这一个 HTTP 端口：页面 /，接口 /api/v1/*，健康检查 /api/v1/health、/api/v1/ready。
    # 打开网页先要登录（第一个管理员来自 .env 中的 NIULAI_ADMIN_USER、NIULAI_ADMIN_PASSWORD）；默认只监听本机
    ports: ["${NIULAI_LISTEN_ADDR:-0.0.0.0}:${NIULAI_PORT:-2606}:8080"]
    restart: unless-stopped
    stop_grace_period: 2m      # 停机时等正在执行的任务结束
    # 常驻约 240 MiB；上限 1.2 GiB 覆盖全市场巡检、组合回测等峰值，日常远用不到
    mem_limit: 1200m
    cpus: 2.5
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  # 一键升级助手：网页上点「一键升级」后，由它备份内置数据库、拉取新镜像并重建 niulai 容器（niulai upgrader）。
  # 它挂载 Docker 的控制接口，能管理这台机器上的容器；niulai 没有这个权限，只能通过共享卷 upgrade 提交一个版本号。
  # .env 中的 COMPOSE_PROFILES=upgrader 启用它，删掉这一行即可关闭一键升级
  upgrader:
    image: ${NIULAI_IMAGE:-ghcr.io/tel9980/niulai:latest}
    profiles: [upgrader]
    command: ["niulai", "upgrader"]
    user: root                 # 访问 Docker 的控制接口需要 root
    # 加固：以 root 运行只为访问 docker.sock（它属于 root，按文件的属主判断权限，不需要额外的 capability）。
    # 放弃全部 capability 后，root 不再是「超级用户」：给共享卷改属主要 CHOWN；
    # 部署目录的文件属于 ubuntu，读写 .env、compose.yml 和 backups/ 要 DAC_OVERRIDE。
    # no-new-privileges 防止程序借 setuid、setgid 程序提权。
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    # 挂载不能再小：部署迁移要改写 compose.yml 和 .env，备份和迁移结果要写进 backups/、.niulai-migrations，
    # 数据目录迁移还要写入 data/postgres，所以整个部署目录都挂进来；upgrade 卷和 Docker 的控制接口也是必需的。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy             # 改写 .env 中的 NIULAI_IMAGE，备份写到 backups/
      - upgrade:/upgrade
    restart: unless-stopped
    # 升级助手平时只轮询文件、用不了多少内存，但备份要把几百 MB 的 dump 经 Docker 控制接口写到挂载目录：
    # 写盘时的脏页会计入这个容器的内存上限，128 MB 时会在备份中途被 OOM 杀掉（2026-10-18 发布 v2026.10.18.9
    # 时实测，见 docs/operations/runbook.md#resource_limits）。程序每写 32 MB 会 sync 一次，把脏页压在这个数以下；
    # 上限仍留 1 GB，覆盖数据继续变大和旧版本升级助手（还没有 sync）的情况。
    mem_limit: 1024m
    cpus: 0.5
    # 健康检查看心跳文件：程序每 3 秒写一次 /upgrade/heartbeat，30 秒没有更新说明卡住了或已经退出
    healthcheck:
      test: ["CMD-SHELL", "[ $(( $$(date +%s) - $$(cat /upgrade/heartbeat 2>/dev/null || echo 0) )) -lt 30 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

volumes:
  # 一键升级时 niulai 和 upgrader 交换的临时文件（升级请求、进度、心跳），丢了也没关系，所以用卷
  upgrade:
